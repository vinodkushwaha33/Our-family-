name: Build Our Family APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract App
        run: |
          unzip -o our-family.zip -d app

      - name: Install Dependencies
        working-directory: app
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Capacitor
        working-directory: app
        run: |
          echo '{"appId":"com.ourfamily.app","appName":"OUR FAMILY","webDir":"dist"}' > capacitor.config.json
          npm run build

      - name: Create Android Project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Our-Family-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
